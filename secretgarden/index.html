<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>the secret garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="win">

  <div class="win-bar">
    <span>the secret garden</span>
    <span class="path">rosearcanum.moe</span>
  </div>

  <div class="win-body">

    <div class="side">
      <div class="side-label">FOLDERS</div>
      <div class="side-list" id="folders"></div>
    </div>

    <div class="pane">
      <div id="entry-list">
        <ul id="entry-list-items">
          <li class="empty-state">loading&hellip;</li>
        </ul>
      </div>
    </div>

  </div>

  <div class="win-status">
    <span id="status-count">&mdash;</span>
    <span><a href="/">study site</a></span>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="app.js"></script>
</body>
</html>
